# Automated dependency update PRs.
#
# Why this is needed rather than optional: everything else in the supply-chain phase makes
# dependencies *fixed* — exact versions, hashes, `npm ci`, a blocking `pip-audit`. Pinning without a
# mechanism for moving the pins is how a project ends up years behind with a red audit gate nobody
# can satisfy, which is precisely how `pillow` sat on 10.4.0 with 17 known vulnerabilities. Pinning
# and automated upgrade PRs are two halves of one control: one makes changes deliberate, the other
# makes them arrive.
#
# Five ecosystems, because the repo has five independent dependency sets and a gap in any of them is
# invisible: Python, the frontend SPA, the Whop publisher bridge, the workflow actions themselves,
# and the Docker base images.
version: 2
updates:
  # --- Python -----------------------------------------------------------------------------------
  #
  # Dependabot reads `requirements.txt` / `requirements-dev.txt` and proposes changes to the
  # *ranges*. It does **not** know about `requirements.lock` / `requirements-dev.lock`, which are
  # generated by `uv` — a tool Dependabot has no support for.
  #
  # That is deliberate and the consequence is intended: a Dependabot PR that moves a range will FAIL
  # the "Locks match their requirements files" job until the locks are regenerated. The failure is
  # the reminder, and it names the command. A lock silently left stale would be worse — it would
  # claim to pin a set that the requirements no longer describe.
  #
  #     uv pip compile --universal --generate-hashes --python-version 3.11 \
  #       --output-file requirements.lock requirements.txt
  #     uv pip compile --universal --generate-hashes --python-version 3.11 \
  #       --output-file requirements-dev.lock requirements-dev.txt
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the tooling rather than six. `ruff`, `black` and `mypy` findings change with
      # their versions, so these upgrades are reviewed by looking at whether the gates still pass —
      # a single PR makes that one decision instead of six interacting ones.
      dev-tooling:
        patterns: ["ruff", "black", "mypy", "pytest*", "hypothesis", "coverage*", "uv"]
    labels: ["dependencies", "python"]

  # --- Frontend SPA -----------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The test/lint stack moves together and has already broken as a set once: jsdom@30 and
      # @testing-library/jest-dom@7 both require Node >=22 and were installed from a Node 22
      # machine, which is why `.npmrc` now sets `engine-strict=true` and why CI tests Node 20.19.
      frontend-tooling:
        patterns:
          ["vitest", "@vitest/*", "jsdom", "@testing-library/*", "eslint*", "prettier", "vite", "@vitejs/*"]
    labels: ["dependencies", "frontend"]

  # --- Whop publisher bridge --------------------------------------------------------------------
  #
  # A separate entry rather than a second directory on the one above, because Dependabot needs a
  # manifest location per ecosystem instance. Small but the most important of the three npm-ish
  # surfaces to keep moving: `@whop/sdk` was declared as `"latest"`, so it was previously "updated"
  # on every image build without review. Pinning it means it now only moves through a PR — which
  # only happens if something opens one.
  - package-ecosystem: npm
    directory: "/publisher_bridge"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    labels: ["dependencies", "publishers"]

  # --- The workflows themselves -----------------------------------------------------------------
  #
  # Actions are code that runs with access to repository secrets, so a stale `actions/checkout` is a
  # supply-chain exposure in the same sense as a stale library — and one that no `pip-audit` or
  # `npm audit` looks at.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "ci"]

  # --- Docker base images -----------------------------------------------------------------------
  #
  # `node:22-slim` and `python:3.11-slim` receive OS-level security fixes that nothing else here
  # tracks: `pip-audit` sees Python packages and `npm audit` sees node packages, and neither has any
  # view of the base image's libc, OpenSSL or ffmpeg.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
    labels: ["dependencies", "docker"]
