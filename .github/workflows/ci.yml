name: CI

on:
  # `push` is restricted to main rather than "**". With every branch included, a push
  # to a branch that has an open PR fired *both* the push and pull_request events, so
  # the whole suite ran twice in parallel for identical code -- visible as separate
  # "Backend (push)" and "Backend (pull_request)" checks. Branch changes are covered
  # by pull_request; main still needs push because the deploy job below requires
  # `github.event_name == 'push'`.
  push:
    branches: [main]
  pull_request:

# Cancel a run that a newer push has superseded. Previously each push left the
# earlier run grinding to completion, which on a ~7 minute backend job meant several
# obsolete runs competing for runners at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because two parity guards in tests/test_stems_parity.py diff the
      # branch against `origin/main` to prove the stem feature did not touch its sibling
      # specs or add production files. The default shallow checkout (depth 1) creates no
      # `origin/main` ref, so `git diff origin/main...HEAD` exits 128 and both tests
      # *skip* -- which the no-skip gate below then reports as a failure, correctly: a
      # guard that silently stops running is worse than no guard. Full history makes them
      # execute rather than making the gate lenient.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # libgl1 / libglib2.0-0 are runtime libs that opencv-python and mediapipe need in order
      # to import at all. Without them `import cv2` raises
      # `libGL.so.1: cannot open shared object file`, so every vision code path silently took
      # its degraded branch here even though the packages were installed — CI was installing
      # opencv and getting no coverage from it. The Dockerfile has always installed these.
      #
      # ffmpeg is likewise not optional: ~90 tests skip without it, and the real-binary
      # capability tests (tests/test_capabilities_real_binary.py) exist specifically to catch
      # probe bugs that every mocked test misses, so they must actually run.
      - name: Install system dependencies (FFmpeg + fonts + opencv runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Blocking, unlike the previous `ruff check . || true`. That step could not fail, so it
      # reported nothing; and with no [tool.ruff] config the enforced rule set was whatever
      # the installed ruff version defaulted to (857 findings on 0.16 versus a handful on
      # older releases). The rule set is now pinned in pyproject.toml, which is what makes
      # blocking on it meaningful.
      #
      - name: Lint (ruff)
        run: ruff check .

      # Blocking, and new. `black` had been a declared dev dependency with no configuration and
      # no CI step since before pyproject.toml existed: 187 of 211 files were unformatted. A
      # formatter nobody runs is worse than none, because every diff becomes a negotiation about
      # whitespace. Configured to line-length 100 in pyproject.toml so it agrees with ruff rather
      # than fighting it.
      - name: Format (black)
        run: black --check --diff .

      - name: Import & boot smoke test
        run: |
          python -c "import config; print('config OK', config.settings.app_name)"
          python -c "from api.main import app; print('FastAPI app OK', app.title)"

      # A7: the emoji the built-in keyword map can produce must be committed, not fetched
      # at render time. `.gitignore` previously excluded them with the comment "downloaded
      # at build time" while no build step existed, so the directory was empty and the
      # overlay had nothing to composite. This runs without network access on purpose --
      # it checks the working tree, it does not fetch.
      - name: Emoji assets are vendored
        run: python scripts/fetch_emoji.py --check

      # A1/A2: same guarantee for the caption faces. A missing font is why captions
      # rendered in whatever the host substituted.
      - name: Caption fonts are vendored
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          manifest = json.loads((root / "assets" / "fonts.json").read_text())
          missing = [
              entry["file"]
              for entry in manifest["fonts"]
              if not (root / "assets" / "fonts" / entry["file"]).is_file()
          ]
          if missing:
              sys.exit(f"missing vendored fonts: {missing}")
          print(f"all {len(manifest['fonts'])} fonts vendored")
          PY

      # Blocking. `mypy` had been a declared dev dependency that never ran; its first run found
      # 143 issues, including two store methods annotated `-> Optional[object]` whose docstrings
      # say they return a clip — which made every attribute access on a clip in `api/main.py`
      # unverifiable. Configuration, including the per-module ratchet, is in pyproject.toml.
      - name: Type check (mypy)
        run: mypy .

      # Fails on warnings as well as failures: filterwarnings=error in pyproject.toml. The
      # capability bug that made the stem engine unreachable was invisible partly because
      # nothing in the suite objected to anything.
      #
      # The suite is also required to run *clean of skips*. A skipped test is not a passing
      # test: ffmpeg and the fonts are installed above, so a skip means a dependency
      # silently went missing and the ~90 tests it gates have quietly stopped running —
      # exactly how the earlier ffmpeg gap went unnoticed.
      #
      # The skip check reads the JUnit XML rather than grepping pytest's summary prose. The
      # previous `grep -qE '[0-9]+ skipped'` was brittle in both directions: pytest is free to
      # reword its summary (which would silently disable the gate), and the pattern matches any
      # line containing that phrasing — including a test *name* or a captured log line. Counting
      # `<skipped>` elements in a machine-readable report cannot drift either way.
      #
      # Coverage is measured and reported but deliberately NOT gated. A number nobody has agreed
      # on becomes a target to game; publishing it first means the threshold can be argued from
      # evidence.
      - name: Tests
        run: |
          pytest --junitxml=pytest-report.xml \
                 --cov=. --cov-report=xml:coverage.xml --cov-report=term

      - name: Fail if any test was skipped
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET

          # A collection failure must not read as success. Checking only for skips passes
          # vacuously on an empty report — a broken conftest, a bad -k, or a report that never
          # got written all produce "no skips across 0 tests". The floor is a canary for that,
          # not a coverage target: it is far below the real count (1958 at time of writing) and
          # should never need adjusting for ordinary growth.
          MINIMUM_TESTS = 1000

          root = ET.parse("pytest-report.xml").getroot()
          cases = list(root.iter("testcase"))
          skipped = [c for c in cases if c.find("skipped") is not None]

          if skipped:
              print(f"::error::{len(skipped)} test(s) were skipped; a required dependency is "
                    "probably missing. A skipped test is not a passing test.")
              for case in skipped:
                  reason = (case.find("skipped").get("message") or "").splitlines()[:1]
                  print(f"  {case.get('classname')}.{case.get('name')}: {reason[0] if reason else ''}")
              sys.exit(1)

          if len(cases) < MINIMUM_TESTS:
              print(f"::error::only {len(cases)} tests in the report, expected at least "
                    f"{MINIMUM_TESTS}. Collection probably failed, so a green result here means "
                    "nothing.")
              sys.exit(1)

          print(f"no skips across {len(cases)} tests")
          PY

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

      # M2: one clip with every effect enabled, rendered by the real ffmpeg. It exists because
      # "nothing measured the real output" is the theme connecting this project's worst defects —
      # a caption in the wrong font still encodes, and a mis-ordered filter still produces a file.
      # Running it only when someone remembered made it a script rather than a check. The artifact
      # is the point: it is reviewable by eye, which is the only way some of these regress visibly.
      - name: Smoke reel (renders one clip with every effect)
        run: |
          mkdir -p smoke-reel
          python scripts/smoke_reel.py --out smoke-reel/reel.mp4

      - name: Upload smoke reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reel
          path: smoke-reel
          if-no-files-found: warn

      # Dependency advisories for Python, matching the frontend's `npm audit`. Report-only for
      # now: `pip-audit` findings usually need a version bump that belongs in the supply-chain
      # phase, and a gate that blocks every PR on an upstream advisory nobody can action here
      # gets disabled rather than fixed.
      - name: Audit Python dependencies (report only)
        if: always()
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit --strict --desc || true

  frontend:
    name: Frontend (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Both runtimes `frontend/.npmrc` declares support for. Node 22 is what the Dockerfile
      # builds with; Node 20 was a *supported but untested* configuration, and the `.npmrc`
      # comment records that it has already broken once — `jsdom@30` (Node >=22) was installed on
      # a newer local runtime and broke the Node 20 job with
      # `webidl.util.markAsUncloneable is not a function`, while `npm ci` exited 0 with warnings.
      # `engine-strict` catches that at install time now, but only on a runtime someone runs.
      #
      # fail-fast off: when one runtime breaks, the useful information is whether the other did.
      fail-fast: false
      matrix:
        node: ["20", "22"]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted, so CI cannot silently test a different
      # dependency tree than a developer has locally.
      - name: Install dependencies
        run: npm ci

      # The lint script existed but eslint was never a dependency and no config file was
      # present, so this command failed outright — the project shipped a lint command that
      # could not lint.
      - name: Lint (eslint)
        run: npm run lint

      # The JavaScript counterpart to `black` on the Python side. eslint was configured for
      # correctness rules only and had nothing to say about layout, so the frontend had the same
      # problem the backend did: no agreed formatting, and therefore whitespace in every diff.
      - name: Format (prettier)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm run test:run

      # Reported, not gated. Only run on one runtime: the number is a property of the tests,
      # not of the Node version, so measuring it twice would just produce two identical
      # numbers and double the runtime.
      - name: Coverage (vitest)
        if: matrix.node == '22'
        run: npm run test:coverage

      - name: Build
        run: npm run build

      # I10: the dev-server advisory chain (esbuild via vite) let any website read responses
      # from a running dev server, and it went unnoticed because nothing ever checked. This
      # blocks on *critical* only, deliberately: the remaining `brace-expansion` DoS sits in
      # eslint's own minimatch chain, and both available "fixes" are worse than the finding --
      # `npm audit fix --force` downgrades eslint-plugin-react to 7.22.0, and overriding
      # brace-expansion to a fixed 5.x breaks minimatch@3 so eslint crashes outright (both
      # verified). A gate that cannot be satisfied without breaking the build gets ignored.
      - name: Audit (block on critical)
        run: npm audit --audit-level=critical

  docker:
    name: Docker (build + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # I12: the plan recorded the Dockerfile as never having been built. Three things can be
      # wrong here that nothing else catches, because each is invisible from a working checkout:
      # the build failing, the build succeeding and the app not starting, and both succeeding
      # while an *asset* is missing because `.dockerignore` excluded it. The font chain has
      # already broken once that way (C1) and the only symptom was substituted captions in
      # rendered output.
      #
      # The script boots the image and probes it rather than leaving a container running, so
      # this is a check that finishes.
      - name: Build and boot the image
        run: scripts/docker_smoke.sh

  deploy:
    name: Deploy (main)
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used inside an `if:` expression — the expression
    # parser does not resolve it, so the previous `if: ${{ secrets.X != '' }}` conditions
    # did not evaluate as intended. Surfacing the values as job-level env vars and testing
    # `env.*` is the supported way to branch on whether a secret is configured.
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RAILWAY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Auto-deploy from main by pinging a provider deploy hook. Configure ONE of
      # these repository secrets to enable it (the step is skipped when unset):
      #   RENDER_DEPLOY_HOOK_URL   — Render "Deploy Hook" URL
      #   RAILWAY_DEPLOY_HOOK_URL  — Railway deploy webhook URL
      - name: Trigger Render deploy
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"

      - name: Trigger Railway deploy
        if: env.RAILWAY_HOOK != ''
        run: curl -fsS -X POST "$RAILWAY_HOOK"

      - name: No deploy hook configured
        if: env.RENDER_HOOK == '' && env.RAILWAY_HOOK == ''
        run: echo "No deploy hook secret set — skipping auto-deploy. See README."
