name: CI

on:
  # `push` is restricted to main rather than "**". With every branch included, a push
  # to a branch that has an open PR fired *both* the push and pull_request events, so
  # the whole suite ran twice in parallel for identical code -- visible as separate
  # "Backend (push)" and "Backend (pull_request)" checks. Branch changes are covered
  # by pull_request; main still needs push because the deploy job below requires
  # `github.event_name == 'push'`.
  push:
    branches: [main]
  pull_request:

# Cancel a run that a newer push has superseded. Previously each push left the
# earlier run grinding to completion, which on a ~7 minute backend job meant several
# obsolete runs competing for runners at once.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 because two parity guards in tests/test_stems_parity.py diff the
      # branch against `origin/main` to prove the stem feature did not touch its sibling
      # specs or add production files. The default shallow checkout (depth 1) creates no
      # `origin/main` ref, so `git diff origin/main...HEAD` exits 128 and both tests
      # *skip* -- which the no-skip gate below then reports as a failure, correctly: a
      # guard that silently stops running is worse than no guard. Full history makes them
      # execute rather than making the gate lenient.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # libgl1 / libglib2.0-0 are runtime libs that opencv-python and mediapipe need in order
      # to import at all. Without them `import cv2` raises
      # `libGL.so.1: cannot open shared object file`, so every vision code path silently took
      # its degraded branch here even though the packages were installed — CI was installing
      # opencv and getting no coverage from it. The Dockerfile has always installed these.
      #
      # ffmpeg is likewise not optional: ~90 tests skip without it, and the real-binary
      # capability tests (tests/test_capabilities_real_binary.py) exist specifically to catch
      # probe bugs that every mocked test misses, so they must actually run.
      - name: Install system dependencies (FFmpeg + fonts + opencv runtime libs)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation libgl1 libglib2.0-0

      # From the lockfile, with hashes enforced. Previously `-r requirements-dev.txt`, which states
      # ranges — so two runs of the same commit could test two different dependency sets, and a
      # green run said nothing about which versions were green. `--require-hashes` additionally
      # makes pip reject any artifact whose digest does not match, and refuses the file outright if
      # any requirement lacks a hash, so the lock cannot be partially bypassed.
      #
      # `requirements-dev.lock` is the superset (requirements-dev.txt includes requirements.txt), so
      # this single install covers runtime and tooling. Installing the two locks in separate steps
      # would let the second resolve a different version of a shared transitive dependency.
      - name: Install Python dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock

      # A lock that has drifted from the requirements it was generated from is worse than no lock:
      # it looks authoritative while pinning the wrong set. This regenerates both locks and fails if
      # the result differs from what is committed — the same argument as `black --check`, applied to
      # dependency resolution.
      #
      # This is a *consistency* check, not an upgrade check, and that distinction is what makes it
      # safe to block on. `uv pip compile` reads the existing output file and prefers the versions
      # already pinned there, so re-running it does not drag in whatever was published this morning
      # — verified: recompiling the committed lock reproduces it byte for byte (same sha256). It
      # fails when someone edits requirements.txt and forgets to regenerate.
      #
      # `uv` comes from the locked install above rather than from a piped install script; see the
      # note in requirements-dev.txt.
      - name: Locks match their requirements files
        run: |
          cp requirements.lock /tmp/requirements.lock.committed
          cp requirements-dev.lock /tmp/requirements-dev.lock.committed
          uv pip compile --universal --generate-hashes --python-version 3.11 \
            --output-file requirements.lock requirements.txt --quiet
          uv pip compile --universal --generate-hashes --python-version 3.11 \
            --output-file requirements-dev.lock requirements-dev.txt --quiet
          if ! diff -u /tmp/requirements.lock.committed requirements.lock; then
            echo "::error::requirements.lock is stale. Regenerate it (see requirements.txt)."
            exit 1
          fi
          if ! diff -u /tmp/requirements-dev.lock.committed requirements-dev.lock; then
            echo "::error::requirements-dev.lock is stale. Regenerate it (see requirements.txt)."
            exit 1
          fi
          echo "both locks agree with their requirements files"

      # Blocking, unlike the previous `ruff check . || true`. That step could not fail, so it
      # reported nothing; and with no [tool.ruff] config the enforced rule set was whatever
      # the installed ruff version defaulted to (857 findings on 0.16 versus a handful on
      # older releases). The rule set is now pinned in pyproject.toml, which is what makes
      # blocking on it meaningful.
      #
      - name: Lint (ruff)
        run: ruff check .

      # Formatting is now enforced. This step used to carry a waiver explaining that `black` was
      # in requirements-dev but had never run, and that adopting it would reformat essentially
      # every file — which it did: 180 of 204, in one commit with nothing else in flight.
      #
      # `--check` rather than a reformat-and-commit: CI reporting a diff is a fact the author can
      # act on, whereas CI silently rewriting the branch means the code that was reviewed is not
      # the code that was tested. Run `black .` locally; the line length is 100 in pyproject.toml
      # to match ruff's, because two formatters disagreeing about where a line ends is worse than
      # either answer.
      - name: Format (black --check)
        run: black --check --diff .

      # mypy was in requirements-dev.txt from the start and had never been run. The first run
      # found 69 errors in 17 files; all 69 are fixed or covered by a narrow, commented
      # per-module override in pyproject.toml, so this step starts clean and blocks.
      #
      # Blocking rather than advisory for the same reason `ruff check .` is: the previous
      # `ruff check . || true` proved that a step which cannot fail reports nothing. The
      # `[tool.mypy]` section also ratchets `disallow_untyped_defs` on the five interface modules
      # other modules depend on, so the strictness grows without a flag day.
      - name: Type check (mypy)
        run: mypy .

      - name: Import & boot smoke test
        run: |
          python -c "import config; print('config OK', config.settings.app_name)"
          python -c "from api.main import app; print('FastAPI app OK', app.title)"

      # The API surface, committed and diffed. `/openapi.json` is served at runtime and was
      # recorded nowhere, so a change that renamed a field or altered a response shape was
      # visible only in the diff of the code that produced it — and a breaking change to a
      # response model reads as a small refactor. The frontend and any external caller consume
      # that surface, so a silent change to it is a silent integration break.
      #
      # Same argument as "Locks match their requirements files" above, applied to the API: a
      # committed document that has drifted is worse than none, because it looks authoritative
      # while describing an API that no longer exists.
      #
      # This duplicates a check in the suite (tests/test_openapi_contract.py) on purpose. It runs
      # here because it costs a second and fails *before* the ~8 minute test job, with a labelled
      # step name and a unified diff, rather than as one failure among 2300 — and because the
      # step is what produces the artifact below.
      #
      # `info.version` is normalised out of the committed document. It comes from `VERSION`, and
      # release.yml fires on a change to that file, so a real version would make the document
      # stale on every release and fail the release PR for a line that says nothing about the
      # API. A check that fails predictably is one people learn to override.
      - name: OpenAPI document matches the code
        run: python scripts/export_openapi.py --check

      # Uploaded so the surface for any build can be downloaded and fed to a client generator or
      # diffed against another branch without checking the code out.
      - name: Upload OpenAPI document
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi.json
          if-no-files-found: error

      # The two native dependencies that can be "installed" and still not work, asserted here so a
      # runner-image or wheel change fails loudly instead of silently switching every dependent code
      # path to its degraded branch.
      #
      # `import cv2` is not redundant with installing opencv: it needs libgl1/libglib2.0-0 at
      # *runtime*, and without them it raises `libGL.so.1: cannot open shared object file`. That
      # exact gap already existed here — CI installed opencv and got no coverage from it, because
      # every vision path caught the ImportError and degraded. The libs are installed above; this is
      # what proves it.
      #
      # ffmpeg is checked for the same two properties the Dockerfile checks, for the same reasons: a
      # major version floor (the `-filters` parser depends on the 7.x flag column, and has been
      # wrong once, hiding 124 of 486 filters) and the presence of `subtitles`, i.e. libass, without
      # which burned captions — the core feature — cannot render at all.
      - name: Native dependencies actually work (opencv, ffmpeg + libass)
        run: |
          python - <<'PY'
          import subprocess, sys, re

          import cv2  # noqa: F401  - the import IS the assertion
          print("opencv OK", cv2.__version__)

          first = subprocess.run(
              ["ffmpeg", "-hide_banner", "-version"], capture_output=True, text=True, check=True
          ).stdout.splitlines()[0]
          print(first)
          match = re.match(r"ffmpeg version n?(\d+)", first)
          if not match:
              sys.exit(f"::error::could not read a major version out of {first!r}")
          major = int(match.group(1))
          if major < 5:
              sys.exit(f"::error::ffmpeg major {major} is below the required 5")

          filters = subprocess.run(
              ["ffmpeg", "-hide_banner", "-filters"], capture_output=True, text=True, check=True
          ).stdout
          names = {
              line.split()[1]
              for line in filters.splitlines()
              if len(line.split()) > 2 and "->" in line
          }
          if "subtitles" not in names:
              sys.exit("::error::this ffmpeg has no 'subtitles' filter: built without libass")
          print(f"ffmpeg OK (major {major}, libass present, {len(names)} filters)")
          PY

      # A7: the emoji the built-in keyword map can produce must be committed, not fetched
      # at render time. `.gitignore` previously excluded them with the comment "downloaded
      # at build time" while no build step existed, so the directory was empty and the
      # overlay had nothing to composite. This runs without network access on purpose --
      # it checks the working tree, it does not fetch.
      - name: Emoji assets are vendored
        run: python scripts/fetch_emoji.py --check

      # A1/A2: same guarantee for the caption faces. A missing font is why captions
      # rendered in whatever the host substituted.
      - name: Caption fonts are vendored
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(".")
          manifest = json.loads((root / "assets" / "fonts.json").read_text())
          missing = [
              entry["file"]
              for entry in manifest["fonts"]
              if not (root / "assets" / "fonts" / entry["file"]).is_file()
          ]
          if missing:
              sys.exit(f"missing vendored fonts: {missing}")
          print(f"all {len(manifest['fonts'])} fonts vendored")
          PY

      # Fails on warnings as well as failures: filterwarnings=error in pyproject.toml. The
      # capability bug that made the stem engine unreachable was invisible partly because
      # nothing in the suite objected to anything.
      #
      # The suite is also required to run *clean of skips*. A skipped test is not a passing
      # test: ffmpeg and the fonts are installed above, so a skip means a dependency
      # silently went missing and the ~90 tests it gates have quietly stopped running —
      # exactly how the earlier ffmpeg gap went unnoticed. `set -o pipefail` keeps pytest's
      # own exit status meaningful through the pipe.
      # The no-skip gate now reads a machine-readable report instead of grepping pytest's summary
      # prose. The semantics are deliberately identical - **any skip fails the build** - but the
      # old `grep -qE '[0-9]+ skipped'` was matching English that pytest is free to reword, and it
      # would equally have matched the phrase appearing in a test name or in captured output. The
      # JUnit XML carries `<skipped>` elements as structure, so the check no longer depends on
      # formatting. It also catches xfail/xpass, which the prose gate did not: both are tests that
      # are not asserting what they claim to.
      - name: Tests
        run: |
          set -o pipefail
          pytest --junit-xml=pytest-report.xml

      - name: No test was skipped
        # `always()` so a skip is still reported when the suite itself failed - a run that both
        # failed and silently stopped running 90 tests should say so, since the skip is usually
        # the cause rather than a second problem.
        if: always()
        run: |
          python - <<'PY'
          import sys, xml.etree.ElementTree as ET
          from pathlib import Path

          report = Path("pytest-report.xml")
          if not report.is_file():
              sys.exit("::error::pytest produced no report; the suite did not run.")

          root = ET.parse(report).getroot()
          suites = root.iter("testsuite") if root.tag == "testsuites" else [root]
          bad = []
          for suite in suites:
              for case in suite.iter("testcase"):
                  for kind in ("skipped", "flaky"):
                      for node in case.findall(kind):
                          name = f"{case.get('classname', '')}::{case.get('name', '')}"
                          bad.append(f"{kind}: {name} - {node.get('message', '') or node.get('type', '')}")
          if bad:
              print("::error::A skipped test is not a passing test. A required dependency is "
                    "probably missing; see scripts/setup_dev_env.sh.")
              for line in bad:
                  print(f"  {line}")
              sys.exit(1)
          total = sum(int(s.get("tests", 0)) for s in suites)
          print(f"{total} tests ran, none skipped.")
          PY

      # Coverage is measured and **reported**, not gated. A threshold chosen before anyone has
      # seen the number either passes by accident or blocks the first honest measurement; the
      # figure is published here so a later PR can set a floor against something real.
      #
      # Run as a second pass rather than by adding `--cov` to `addopts`, and that is not merely
      # tidiness: coverage instrumentation changes garbage-collection timing, which is enough to
      # move an unclosed-socket `ResourceWarning` raised inside yt-dlp from after the session into
      # the middle of a test - where `filterwarnings = error` correctly fails it. Keeping the
      # gating run uninstrumented means the suite that decides whether this build passes is the
      # same one a developer runs locally.
      - name: Coverage (reported, not gated)
        run: |
          pytest -q -p no:cacheprovider \
            --cov=api --cov=worker --cov=publishers --cov=storage_backends \
            --cov=config --cov=profiles --cov=runtime_config --cov=updates \
            --cov-report=term --cov-report=xml:coverage.xml \
            | tail -40

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: warn

      # `scripts/smoke_reel.py` renders one clip with every effect enabled. It exists because
      # "nothing measured the real output", and until now it ran only when someone remembered to
      # run it. The artifact is the point: a human can watch 20 seconds of video and see a
      # regression that no assertion in the suite describes.
      - name: Visual smoke reel
        run: python scripts/smoke_reel.py --out smoke_reel.mp4

      - name: Upload smoke reel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-reel
          path: smoke_reel.mp4
          if-no-files-found: warn

      # Isolated on purpose. `pip-audit` depends on `requests`, and installing `requests` into the
      # environment the suite runs in switches yt-dlp to a request handler that leaks a socket -
      # whose `ResourceWarning` then fails an unrelated test under `filterwarnings = error`
      # (measured: 3-4 non-deterministic failures in tests/test_url_ingest.py). Auditing the
      # dependency set must not alter the dependency set. A separate venv keeps both true, which
      # is also why pip-audit is not in requirements-dev.txt.
      #
      # **Now blocking**, and audits the lock rather than the ranges.
      #
      # It was `continue-on-error: true`, with the honest reason that three dependencies were
      # unbounded and there was no lockfile, so the step could not be satisfied. Both are fixed, and
      # leaving it advisory would repeat the mistake the repo already made with `ruff check . || true`
      # — a step that cannot fail reports nothing.
      #
      # Flipping it also immediately paid for itself: auditing the resolved set instead of the
      # ranges surfaced **17 vulnerabilities in pillow 10.4.0**, all fixed in 12.x, i.e. reachable
      # only by raising the `<11.0` ceiling. The upper bound meant to prevent an unreviewed upgrade
      # was pinning the project to known heap-corruption defects in the image and font parsers this
      # app feeds arbitrary downloaded media through. That is now `>=12.3,<13.0` and the audit is
      # clean (69 packages, zero findings).
      #
      # Auditing `requirements.lock` is the point: `requirements.txt` states ranges, so auditing it
      # asks "could a safe version satisfy this?" when the question that matters is "is the version
      # we actually ship safe?".
      #
      # A newly published advisory can now redden a PR that changed nothing. That is intended — it
      # is a dependency that needs upgrading, Dependabot opens that PR automatically, and the lock
      # makes the upgrade a reviewable diff.
      - name: Audit Python dependencies (pip-audit, isolated)
        run: |
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet --upgrade pip pip-audit
          /tmp/audit-venv/bin/pip-audit --requirement requirements.lock --strict --desc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    strategy:
      # Both legs run to completion; a Node 20 failure should not hide a Node 22 one, since the
      # whole reason for the matrix is that the two runtimes have already diverged once.
      fail-fast: false
      matrix:
        # `package.json` declares `engines.node: ^20.9.0 || >=22.0.0`, so Node 20 was a
        # **supported but untested** configuration - and `.npmrc` records that it has already
        # broken once (jsdom@30 and @testing-library/jest-dom@7 both require >=22 and were
        # installed from a Node 22 machine, which `engine-strict=true` now prevents). Testing the
        # floor is what makes that declaration mean something.
        #
        # 20.19 rather than 20: vite 8 requires ^20.19.0 || >=22.12.0, so the declared floor of
        # 20.9 cannot actually build. That gap is real and worth stating - the honest floor for a
        # *build* is 20.19 even though the dependency metadata permits 20.9.
        node-version: ["20.19", "22"]
    name: Frontend (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and fails if
      # package.json and the lock have drifted, so CI cannot silently test a different
      # dependency tree than a developer has locally.
      - name: Install dependencies
        run: npm ci

      # The lint script existed but eslint was never a dependency and no config file was
      # present, so this command failed outright — the project shipped a lint command that
      # could not lint.
      - name: Lint (eslint)
        run: npm run lint

      # The frontend counterpart to `black --check`. Adopted in the same commit and for the same
      # reason: formatting arguments are not worth having, and `printWidth` is 100 to match both
      # black and ruff so the two halves of the repo agree on where a line ends.
      #
      # `--check`, not `--write`, so CI reports rather than rewrites. Run `npm run format` locally.
      - name: Format (prettier --check)
        run: npm run format:check

      - name: Tests (vitest)
        run: npm run test:run

      # Reported, not gated, and on one leg only - the number does not depend on the Node version,
      # so measuring it twice would just produce two artifacts with the same content.
      # `@vitest/coverage-v8` was already installed and had never been configured.
      - name: Coverage (reported, not gated)
        if: matrix.node-version == '22'
        run: npm run test:coverage

      - name: Upload frontend coverage
        if: always() && matrix.node-version == '22'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          if-no-files-found: warn

      - name: Build
        run: npm run build

      # I10: the dev-server advisory chain (esbuild via vite) let any website read responses
      # from a running dev server, and it went unnoticed because nothing ever checked. This
      # blocks on *critical* only, deliberately: the remaining `brace-expansion` DoS sits in
      # eslint's own minimatch chain, and both available "fixes" are worse than the finding --
      # `npm audit fix --force` downgrades eslint-plugin-react to 7.22.0, and overriding
      # brace-expansion to a fixed 5.x breaks minimatch@3 so eslint crashes outright (both
      # verified). A gate that cannot be satisfied without breaking the build gets ignored.
      - name: Audit (block on critical)
        run: npm audit --audit-level=critical

  docker:
    name: Docker (build + boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # I12: the plan recorded the Dockerfile as never having been built. Three things can be
      # wrong here that nothing else catches, because each is invisible from a working checkout:
      # the build failing, the build succeeding and the app not starting, and both succeeding
      # while an *asset* is missing because `.dockerignore` excluded it. The font chain has
      # already broken once that way (C1) and the only symptom was substituted captions in
      # rendered output.
      #
      # The script boots the image and probes it rather than leaving a container running, so
      # this is a check that finishes.
      - name: Build and boot the image
        run: scripts/docker_smoke.sh

  deploy:
    name: Deploy (main)
    needs: [backend, frontend, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    # The `secrets` context cannot be used inside an `if:` expression — the expression
    # parser does not resolve it, so the previous `if: ${{ secrets.X != '' }}` conditions
    # did not evaluate as intended. Surfacing the values as job-level env vars and testing
    # `env.*` is the supported way to branch on whether a secret is configured.
    env:
      RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RAILWAY_HOOK: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
    steps:
      - uses: actions/checkout@v4

      # Auto-deploy from main by pinging a provider deploy hook. Configure ONE of
      # these repository secrets to enable it (the step is skipped when unset):
      #   RENDER_DEPLOY_HOOK_URL   — Render "Deploy Hook" URL
      #   RAILWAY_DEPLOY_HOOK_URL  — Railway deploy webhook URL
      - name: Trigger Render deploy
        if: env.RENDER_HOOK != ''
        run: curl -fsS -X POST "$RENDER_HOOK"

      - name: Trigger Railway deploy
        if: env.RAILWAY_HOOK != ''
        run: curl -fsS -X POST "$RAILWAY_HOOK"

      - name: No deploy hook configured
        if: env.RENDER_HOOK == '' && env.RAILWAY_HOOK == ''
        run: echo "No deploy hook secret set — skipping auto-deploy. See README."
