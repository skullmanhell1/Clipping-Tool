[tool.pytest.ini_options]
# The suite previously ran with no configuration at all, which meant a typo'd marker
# silently did nothing, a typo'd option key was ignored, and warnings — including
# deprecations from our own code — scrolled past unnoticed.
minversion = "8.0"
testpaths = ["tests"]

addopts = [
    # A misspelt marker (@pytest.mark.slwo) would otherwise be silently accepted and
    # the test would just never be selected.
    "--strict-markers",
    # Same idea for this file: an unknown key here becomes an error rather than being
    # quietly dropped.
    "--strict-config",
    # Show the reason for every skip/xfail, so a test that stops running because a
    # binary went missing is visible instead of hiding in a summary count.
    "-ra",
]

# Warnings are errors. The bug that motivated most of this hardening was invisible
# precisely because nothing in the suite objected to it, and a DeprecationWarning is the
# usual early notice that a dependency is about to break. Third-party warnings we cannot
# fix are ignored individually rather than by relaxing the whole policy.
filterwarnings = [
    "error",
    # starlette's TestClient warns about httpx; there is no httpx2 release to move to.
    # Matched by message with no category, because starlette raises its own
    # StarletteDeprecationWarning rather than the builtin DeprecationWarning.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
    # google.protobuf (via mediapipe) reaches into deprecated importlib APIs.
    "ignore:Deprecated call to `pkg_resources:DeprecationWarning",
    "ignore:pkg_resources is deprecated as an API:DeprecationWarning",
    # SWIG-generated bindings in mediapipe declare __module__ in a way Python 3.11 flags.
    "ignore:builtin type (SwigPyPacked|SwigPyObject|swigvarlink) has no __module__ attribute:DeprecationWarning",
]

markers = [
    "slow: takes more than a second or two; deselect with '-m \"not slow\"'",
    "real_binary: shells out to a real ffmpeg/ffprobe rather than an injected runner",
]


[tool.black]
# I9. Line length matches ruff's below; they disagree by default (black 88, ruff 88 but
# this project 100) and a disagreement means one tool reformats what the other rejects.
line-length = 100
target-version = ["py311"]
# Mirrors [tool.ruff].exclude. black does not read that, and without this it would
# reformat the vendored frontend and anything left in storage/.
extend-exclude = '''
/(
    \.venv
  | frontend
  | storage
)/
'''


[tool.ruff]
# Previously there was no ruff configuration at all, so the enforced rule set was
# whatever the installed ruff version happened to default to — 857 findings on ruff 0.16
# versus a handful on older releases. That variability is why CI ran `ruff check . ||
# true`: the step could not be trusted to mean anything. Pinning the selection makes the
# result reproducible, which is what allows CI to block on it.
target-version = "py311"
line-length = 100
exclude = ["frontend", ".venv", "storage"]

[tool.ruff.lint]
# I9 adds `UP` and `B` to the original focused set. They were held back deliberately —
# each is a mechanical sweep across ~90 files and had no business landing in the same
# change as a behavioural fix, where the one line that mattered would have been invisible
# among six hundred that did not.
select = [
    "F",   # pyflakes: undefined names, unused imports/variables — real bugs
    "E4",  # import placement/shadowing
    "E7",  # statement-level mistakes
    "E9",  # syntax and IO errors
    "I",   # import sorting, so import blocks stop churning between contributors
    "UP",  # pyupgrade: py311 idiom (`X | None`, `list[...]`, StrEnum)
    "B",   # bugbear: likely bugs — chiefly `zip()` that silently truncates
    # `S` is not part of I9. It arrived on the base branch with the security phase while this
    # sweep was being prepared, and the merge keeps it: this change adds rules, and dropping one
    # would be a silent narrowing of the gate disguised as a formatting commit. Its three
    # wholesale ignores and its per-file test exemptions are below, unchanged.
    "S",   # bandit: security findings. Three rules are ignored below, with reasons.
]

# Three `S` rules are switched off wholesale rather than annotated ~50 times. Each is a rule that
# fires on the pattern this project deliberately uses, so leaving them on would mean either a wall
# of identical `# noqa` comments or a lint step nobody trusts — and the second is what the previous
# `ruff check . || true` already proved happens.
#
# The finding that would have mattered is **S602 (`shell=True`), and there are zero of those.**
# That is the result worth recording: every subprocess call in this repository passes an argument
# list, so no caller-supplied string is ever handed to a shell.
ignore = [
    # S603 flags *every* subprocess call and asks the reader to confirm the input is trusted. All
    # 19 outside tests are argv-list invocations of ffmpeg, ffprobe, fc-match or node — which is
    # the whole architecture of the project, and already the safe form. The genuine risk in this
    # area is a filter string built from caller input, which `tests/test_output_compat.py` and the
    # capability probes police far more precisely than a lint rule can.
    "S603",
    # S110/S112 (try/except/pass and try/except/continue) are the shape of this project's
    # degradation contract: an optional feature that cannot run records a marker on
    # `ClipResult.effects_applied` and the job continues, because a missing effect must never fail
    # a render. Turning each into a log line is an observability change with real behavioural risk
    # — Phase 7 is where per-stage instrumentation belongs — and doing it as a lint fix would edit
    # ~30 degradation paths at once. Deliberately deferred, not overlooked.
    "S110",
    "S112",
]

[tool.ruff.lint.flake8-bugbear]
# B008 flags a function call in a default argument, which is right almost everywhere and
# wrong for FastAPI: `File(...)`, `Form(...)`, `Depends(...)` and `Query(...)` in a default
# *are* the framework's parameter declaration syntax, not values captured once at import.
# Listed here rather than silenced per-file so the rule keeps working on genuine cases in
# the same modules — `api/main.py` has ~90 `Form(...)` parameters and one real mistake in
# there would otherwise be indistinguishable from them.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# `"publishers/*" = ["E701", "E702", "E403"]` used to live here, for a deliberately
# compressed one-statement-per-line style (`self._stop.clear(); self._thread = ...`). I9's
# black run expanded it, so the exemption now suppresses nothing — verified with
# `ruff check publishers --select E701,E702,E401 --config 'lint.per-file-ignores={}'`.
# Removed rather than left in place: a stale exemption reads as "these rules are known to
# fail here", which would be untrue and would hide it if they started failing again.
#
# tests/* imports after module-level setup on purpose: conftest rewrites environment
# variables before `config` is imported, and several test modules import their subject
# only after installing a guard. That ordering is the point, so E402 cannot apply.
#
# The `S` (bandit) exemptions are all "this rule describes what a test is". S101 alone accounts
# for 4,691 of the 4,916 findings in the repository: `assert` is the entire mechanism. The rest
# follow — fake tokens in fixtures are not leaked secrets, a tmp_path is not an insecure temp
# file, and running the real ffmpeg is the point of the real-binary tests that exist precisely
# because every mocked capability probe missed a defect. S102/S307 cover the two deliberate
# exec/eval call sites in test_kinetic_compositor.py and test_stems_ffmpeg.py, each already
# carrying a comment explaining that it evaluates this project's own emitted expression.
"tests/*" = [
    "E402",
    "S101",  # assert — what a test is made of
    "S102",  # exec — two documented sites that compile this repo's own generated source
    "S105",  # "hardcoded password" — fixture tokens like "test-shared-secret"
    "S106",  # same, passed as an argument
    "S107",  # same, as a default
    "S108",  # "insecure temp file" — pytest tmp_path fixtures
    "S306",  # mktemp — in test helpers only
    "S307",  # eval — one documented site evaluating our own emitted expression
    "S311",  # non-crypto random — generating test data
    "S603",  # subprocess — running the real ffmpeg is the point
    "S607",  # partial executable path — ffmpeg/ffprobe resolved via PATH
]
