# Render.com Blueprint — one-click deploy of the AI Video Clipper.
#
# In Render: New + > Blueprint, point at this repo. Render builds the Dockerfile
# (single container serving the API + built React UI) and runs it. Set the
# secret env vars (LLM/publisher keys, and S3_* if STORAGE_BACKEND=s3) in the
# service dashboard — they are marked sync:false below so they are not committed.
#
# For auto-deploy from CI, copy the service's "Deploy Hook" URL into the repo
# secret RENDER_DEPLOY_HOOK_URL (see .github/workflows/ci.yml).
services:
  - type: web
    name: ai-video-clipper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # whisper + ffmpeg need memory/CPU (2 GB+)
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: clipper-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      # Set this to your site's origin, e.g. https://ai-video-clipper.onrender.com
      # (or your custom domain). It is deliberately left blank rather than defaulted:
      #
      #   * The application default is "*", which is fine for local development but
      #     lets any site call this API once it is public.
      #   * A wildcard also disables credentialed cross-origin requests, because the
      #     CORS specification forbids combining "*" with
      #     Access-Control-Allow-Credentials and browsers reject such a response.
      #
      # Leaving it unset boots with the wildcard and logs a warning on every start,
      # since ENVIRONMENT is production here. Comma-separate multiple origins.
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_BACKEND
        value: local        # set to "s3" and fill the S3_* vars for durable storage
      # Must match `config.py`'s default. This blueprint pinned `base` while the application
      # default was raised to `small` by plan item T1 — so the one deployment anybody actually
      # visits was silently running the *worse* transcription, and only a fresh local install got
      # the improvement. T1 is a P0 for a concrete reason: a mis-transcribed word is burned into
      # the video, and captions are the most visible artefact the tool produces.
      #
      # Set explicitly rather than omitted, because an operator reading this file should be able
      # to see which model their deployment uses without cross-referencing the code. If you change
      # it, change it here *and* know that `config.py` disagrees.
      - key: WHISPER_MODEL
        value: small
      - key: RETENTION_DAYS
        value: "30"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
