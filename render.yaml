# Render.com Blueprint — one-click deploy of the AI Video Clipper.
#
# In Render: New + > Blueprint, point at this repo. Render builds the Dockerfile
# (single container serving the API + built React UI) and runs it. Set the
# secret env vars (LLM/publisher keys, and S3_* if STORAGE_BACKEND=s3) in the
# service dashboard — they are marked sync:false below so they are not committed.
#
# For auto-deploy from CI, copy the service's "Deploy Hook" URL into the repo
# secret RENDER_DEPLOY_HOOK_URL (see .github/workflows/ci.yml).
services:
  - type: web
    name: ai-video-clipper
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard          # whisper + ffmpeg need memory/CPU (2 GB+)
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: clipper-storage
      mountPath: /app/storage
      sizeGB: 10
    envVars:
      - key: ENVIRONMENT
        value: production
      # The shared secret for /api/* and /clips/*. `generateValue: true` makes Render
      # mint a random value at sync time and keep it out of this file.
      #
      # This is NOT optional, and that is the whole point of declaring it here. With
      # ENVIRONMENT=production, `_check_deployment_security()` in api/main.py *refuses to
      # boot* without a token — it raises InsecureDeploymentError from inside the ASGI
      # lifespan, so uvicorn never binds, `healthCheckPath` never answers, and with
      # `autoDeploy: true` every push produces a failed deploy. Omitting this key did not
      # mean "deploy without auth", it meant "do not deploy". Read it out of the service
      # dashboard (Environment tab) to make requests: `Authorization: Bearer <value>`.
      - key: API_AUTH_TOKEN
        generateValue: true
      # Empty on purpose, and it must be *present* rather than absent.
      #
      # This blueprint runs one container that serves the API and the built React UI from
      # the same origin (see the StaticFiles mount at the end of api/main.py), so the
      # browser never makes a cross-origin call and the correct origin list is the empty
      # one. An empty value parses to `[]` via Settings.cors_origins_list, which makes
      # `cors_allow_wildcard` false and satisfies the production gate.
      #
      # Leaving the key out entirely does not do this. The application default is "*", and
      # under ENVIRONMENT=production the wildcard is the *second* refuse-to-boot condition
      # in `_check_deployment_security()` — so an absent key fails the deploy exactly as a
      # missing token does. An earlier version of this comment claimed the wildcard merely
      # "logs a warning on every start"; that was true before the gate was tightened and
      # has been wrong ever since.
      #
      # Only set a value if you serve the UI from somewhere else — then list that origin,
      # with its scheme, comma-separated: https://clips.example.com,https://www.example.com
      # A scheme-less host will not match the browser's Origin header and silently blocks.
      - key: CORS_ORIGINS
        value: ""
      - key: STORAGE_BACKEND
        value: local        # set to "s3" and fill the S3_* vars for durable storage
      - key: WHISPER_MODEL
        # Was `base`, which silently undid T1. `config.py` raised the default to `small`
        # because `base` is a noticeable accuracy step down and captions are the most
        # visible artefact the tool produces - so this blueprint was shipping worse
        # captions than the code was designed for, on every clip, with no symptom other
        # than the words being wrong. Keep this equal to `config.py`'s default.
        value: small
      - key: RETENTION_DAYS
        value: "30"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
